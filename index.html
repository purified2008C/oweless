<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWELESS — Know Who Owes You</title>

<style>
:root{
  --green:#0b8a4b;
  --green-dark:#076b3a;
  --green-light:#e9f8f0;
  --bg:#f5f7f6;
  --white:#ffffff;
  --text:#18201c;
  --muted:#6d7771;
  --border:#e2e8e4;
  --red:#d93636;
  --red-light:#fff0f0;
  --orange:#e68a00;
  --orange-light:#fff7e8;
  --blue:#2878d8;
  --blue-light:#edf5ff;
  --shadow:0 8px 30px rgba(15,30,22,.07);
  --radius:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}

/* =========================
   LANDING
========================= */

.landing{
  min-height:100vh;
  background:#fff;
}

.navbar{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:25px;
  font-weight:900;
  color:var(--green);
  letter-spacing:-1px;
}

.logo span{
  color:var(--text);
}

.nav-actions{
  display:flex;
  gap:10px;
}

.hero{
  max-width:1150px;
  margin:auto;
  padding:90px 24px 70px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:60px;
  align-items:center;
}

.hero h1{
  font-size:58px;
  line-height:1.04;
  letter-spacing:-2px;
  margin-bottom:20px;
}

.hero h1 span{
  color:var(--green);
}

.hero p{
  color:var(--muted);
  font-size:19px;
  line-height:1.7;
  max-width:600px;
  margin-bottom:30px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.hero-card{
  background:var(--green);
  color:white;
  padding:30px;
  border-radius:30px;
  box-shadow:var(--shadow);
}

.hero-card h3{
  font-size:25px;
  margin-bottom:22px;
}

.demo-balance{
  background:rgba(255,255,255,.12);
  padding:22px;
  border-radius:18px;
  margin-bottom:15px;
}

.demo-balance small{
  opacity:.8;
}

.demo-balance strong{
  display:block;
  font-size:36px;
  margin-top:7px;
}

.demo-row{
  display:flex;
  justify-content:space-between;
  padding:16px 0;
  border-bottom:1px solid rgba(255,255,255,.14);
}

.features{
  max-width:1150px;
  margin:auto;
  padding:60px 24px 90px;
}

.section-title{
  text-align:center;
  margin-bottom:35px;
}

.section-title h2{
  font-size:35px;
  margin-bottom:10px;
}

.section-title p{
  color:var(--muted);
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.feature-card{
  background:white;
  padding:28px;
  border-radius:20px;
  border:1px solid var(--border);
}

.feature-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:var(--green-light);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  margin-bottom:18px;
}

.feature-card h3{
  margin-bottom:10px;
}

.feature-card p{
  color:var(--muted);
  line-height:1.6;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:none;
  border-radius:12px;
  padding:13px 18px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--green);
  color:white;
}

.btn-primary:hover{
  background:var(--green-dark);
}

.btn-secondary{
  background:white;
  color:var(--text);
  border:1px solid var(--border);
}

.btn-danger{
  background:var(--red);
  color:white;
}

.btn-small{
  padding:9px 12px;
  font-size:13px;
}

.btn-full{
  width:100%;
}

/* =========================
   AUTH
========================= */

.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:linear-gradient(135deg,#f4fbf7,#ffffff);
}

.auth-box{
  width:100%;
  max-width:470px;
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px;
  box-shadow:var(--shadow);
}

.auth-logo{
  text-align:center;
  margin-bottom:25px;
}

.auth-box h1{
  text-align:center;
  margin-bottom:8px;
}

.auth-subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}

.form-group input,
.form-group select{
  width:100%;
  border:1px solid var(--border);
  border-radius:11px;
  padding:13px 14px;
  outline:none;
  background:white;
}

.form-group input:focus,
.form-group select:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(11,138,75,.08);
}

.auth-switch{
  text-align:center;
  margin-top:20px;
  color:var(--muted);
  font-size:14px;
}

.auth-switch button{
  border:none;
  background:none;
  color:var(--green);
  font-weight:700;
}

.auth-error{
  background:var(--red-light);
  color:var(--red);
  border:1px solid #ffd0d0;
  padding:11px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:14px;
}

.auth-success{
  background:var(--green-light);
  color:var(--green-dark);
  border:1px solid #c8ecd9;
  padding:11px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:14px;
}

/* =========================
   APP LAYOUT
========================= */

.dashboard-app{
  min-height:100vh;
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:50;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.menu-btn{
  display:none;
  border:none;
  background:var(--green-light);
  color:var(--green);
  width:40px;
  height:40px;
  border-radius:10px;
}

.business-name{
  font-weight:800;
}

.user-mini{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:38px;
  height:38px;
  background:var(--green);
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.layout{
  display:flex;
  min-height:calc(100vh - 70px);
}

.sidebar{
  width:245px;
  background:white;
  border-right:1px solid var(--border);
  padding:22px 14px;
  flex-shrink:0;
}

.nav-item{
  width:100%;
  border:none;
  background:transparent;
  text-align:left;
  padding:13px 15px;
  border-radius:12px;
  margin-bottom:5px;
  color:var(--muted);
  font-weight:700;
}

.nav-item:hover,
.nav-item.active{
  background:var(--green-light);
  color:var(--green);
}

.nav-item .nav-icon{
  display:inline-block;
  width:25px;
}

.main{
  flex:1;
  padding:28px;
  max-width:1400px;
  margin:auto;
  width:100%;
}

/* =========================
   DASHBOARD
========================= */

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

.page-header h1{
  font-size:29px;
  margin-bottom:5px;
}

.page-header p{
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:24px;
}

.stat-card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.stat-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  background:var(--green-light);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
}

.stat-card small{
  color:var(--muted);
  font-weight:600;
}

.stat-value{
  font-size:27px;
  font-weight:900;
}

.stat-danger .stat-icon{
  background:var(--red-light);
  color:var(--red);
}

.stat-warning .stat-icon{
  background:var(--orange-light);
  color:var(--orange);
}

.content-grid{
  display:grid;
  grid-template-columns:1.4fr .8fr;
  gap:20px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:15px;
}

.card-header h2{
  font-size:19px;
}

.card-header button{
  border:none;
  background:none;
  color:var(--green);
  font-weight:700;
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:40px;
  margin-bottom:12px;
}

/* =========================
   DEBT CARD
========================= */

.debt-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.debt-card{
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
}

.debt-main{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.customer-name{
  font-weight:800;
  font-size:16px;
}

.item-name{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.amount{
  font-size:18px;
  font-weight:900;
  text-align:right;
}

.debt-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}

.badge-danger{
  background:var(--red-light);
  color:var(--red);
}

.badge-warning{
  background:var(--orange-light);
  color:var(--orange);
}

.badge-success{
  background:var(--green-light);
  color:var(--green-dark);
}

.badge-blue{
  background:var(--blue-light);
  color:var(--blue);
}

.debt-actions{
  display:flex;
  gap:7px;
  margin-top:14px;
  flex-wrap:wrap;
}

/* =========================
   SEARCH/FILTER
========================= */

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.search-box{
  flex:1;
  min-width:220px;
}

.search-box input,
.toolbar select{
  width:100%;
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px 14px;
  outline:none;
  background:white;
}

.filter-buttons{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.filter-btn{
  border:1px solid var(--border);
  background:white;
  border-radius:10px;
  padding:9px 12px;
  font-size:13px;
  font-weight:700;
}

.filter-btn.active{
  background:var(--green);
  border-color:var(--green);
  color:white;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal{
  background:white;
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  padding:25px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close-btn{
  width:35px;
  height:35px;
  border:none;
  background:var(--bg);
  border-radius:50%;
  font-size:18px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-actions .btn{
  flex:1;
}

/* =========================
   ACCOUNT
========================= */

.profile-card{
  max-width:700px;
}

.profile-row{
  padding:17px 0;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  gap:20px;
}

.profile-row:last-child{
  border-bottom:none;
}

.profile-label{
  color:var(--muted);
  font-size:13px;
}

.profile-value{
  font-weight:700;
  text-align:right;
}

/* =========================
   FOLLOW UP
========================= */

.followup-section{
  margin-bottom:25px;
}

.followup-title{
  font-size:17px;
  margin-bottom:12px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#18201c;
  color:white;
  padding:13px 17px;
  border-radius:12px;
  box-shadow:var(--shadow);
  z-index:200;
  max-width:320px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){
  .hero{
    grid-template-columns:1fr;
  }

  .feature-grid{
    grid-template-columns:1fr 1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .content-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:760px){
  .navbar{
    padding:0 18px;
  }

  .hero{
    padding:55px 20px;
  }

  .hero h1{
    font-size:43px;
  }

  .feature-grid{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:fixed;
    left:-270px;
    top:70px;
    bottom:0;
    z-index:60;
    transition:.25s;
    box-shadow:var(--shadow);
  }

  .sidebar.open{
    left:0;
  }

  .menu-btn{
    display:block;
  }

  .main{
    padding:20px 15px 90px;
  }

  .topbar{
    padding:0 15px;
  }

  .business-name{
    display:none;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    padding:16px;
  }

  .stat-value{
    font-size:21px;
  }

  .page-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .debt-main{
    flex-direction:column;
  }

  .amount{
    text-align:left;
  }

  .profile-row{
    flex-direction:column;
  }

  .profile-value{
    text-align:left;
  }

@media(max-width:420px){
  .auth-box{
    padding:23px 18px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .stat-card small{
    font-size:11px;
  }

  .stat-value{
    font-size:18px;
  }

</style>
</head>

<body>

<div id="app"></div>

<script>
/* ============================================================
   OWELESS PROTOTYPE
   ============================================================

   IMPORTANT:
   This is a browser/localStorage prototype.

   It is NOT production authentication.
   Passwords are stored locally for demonstration only.

   Production version should use:
   - Secure backend
   - Hashed passwords
   - Database
   - Server-side authentication
   - Authorization
   - Password reset
   - Secure sessions/tokens
   ============================================================ */

const STORAGE = {
  USERS: "oweless_users",
  DEBTS: "oweless_debts",
  SESSION: "oweless_session"
};

let currentPage = "home";
let currentFilter = "all";
let searchText = "";
let editingDebtId = null;

/* =========================
   STORAGE HELPERS
========================= */

function getUsers(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE.USERS)) || [];
  }catch(e){
    return [];
  }
}

function saveUsers(users){
  localStorage.setItem(STORAGE.USERS, JSON.stringify(users));
}

function getDebts(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE.DEBTS)) || [];
  }catch(e){
    return [];
  }
}

function saveDebts(debts){
  localStorage.setItem(STORAGE.DEBTS, JSON.stringify(debts));
}

function getSession(){
  return localStorage.getItem(STORAGE.SESSION);
}

function setSession(userId){
  localStorage.setItem(STORAGE.SESSION, userId);
}

function clearSession(){
  localStorage.removeItem(STORAGE.SESSION);
}

function getCurrentUser(){
  const session = getSession();
  if(!session) return null;

  return getUsers().find(u => u.id === session) || null;
}

function userDebts(){
  const user = getCurrentUser();
  if(!user) return [];

  return getDebts().filter(d => d.userId === user.id);
}

/* =========================
   UTILITIES
========================= */

function uid(prefix="id"){
  return prefix + "_" + Date.now() + "_" +
    Math.random().toString(36).substring(2,9);
}

function money(amount){
  return "₦" + Number(amount || 0).toLocaleString("en-NG",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(date){
  if(!date) return "—";

  const d = new Date(date + "T00:00:00");

  if(isNaN(d.getTime())) return date;

  return d.toLocaleDateString("en-NG",{
    day:"numeric",
    month:"short",
    year:"numeric"
  });
}

function todayString(){
  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

function getDebtRemaining(debt){
  return Math.max(
    0,
    Number(debt.amount || 0) - Number(debt.paidAmount || 0)
  );
}

function isPaid(debt){
  return getDebtRemaining(debt) <= 0;
}

function getStatus(debt){
  if(isPaid(debt)) return "paid";

  const today = todayString();

  if(debt.dueDate < today) return "overdue";

  if(debt.dueDate === today) return "today";

  return "upcoming";
}

function statusLabel(status){
  if(status === "overdue") return "Overdue";
  if(status === "today") return "Due Today";
  if(status === "upcoming") return "Coming Up";
  return "Paid";
}

function statusClass(status){
  if(status === "overdue") return "badge-danger";
  if(status === "today") return "badge-warning";
  if(status === "upcoming") return "badge-blue";
  return "badge-success";
}

function showToast(message){
  const old = document.querySelector(".toast");
  if(old) old.remove();

  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = message;

  document.body.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },3000);
}

/* =========================
   LANDING
========================= */

function renderLanding(){
  document.getElementById("app").innerHTML = `
    <div class="landing">

      <header class="navbar">
        <div class="logo">OWE<span>LESS</span></div>

        <div class="nav-actions">
          <button class="btn btn-secondary"
            onclick="showLogin()">Log In</button>

          <button class="btn btn-primary"
            onclick="showSignup()">Get Started</button>
        </div>
      </header>

      <section class="hero">

        <div>
          <div style="
            display:inline-block;
            background:#e9f8f0;
            color:#0b8a4b;
            padding:8px 12px;
            border-radius:30px;
            font-size:13px;
            font-weight:800;
            margin-bottom:18px;">
            FOR SMALL BUSINESSES
          </div>

          <h1>
            Know who owes you.
            <span>Never forget a payment.</span>
          </h1>

          <p>
            OWELESS helps small business owners track customer debts,
            remember when payments are due, follow up easily on WhatsApp,
            and keep payment records in one simple place.
          </p>

          <div class="hero-buttons">
            <button class="btn btn-primary"
              onclick="showSignup()">
              Start Tracking Free
            </button>

            <button class="btn btn-secondary"
              onclick="showLogin()">
              I Already Have an Account
            </button>
          </div>
        </div>

        <div class="hero-card">

          <h3>Your debts. Under control.</h3>

          <div class="demo-balance">
            <small>Total Outstanding</small>
            <strong>₦185,000</strong>
          </div>

          <div class="demo-row">
            <span>Customers Owing</span>
            <strong>7</strong>
          </div>

          <div class="demo-row">
            <span>Overdue</span>
            <strong>3</strong>
          </div>

          <div class="demo-row">
            <span>Due Today</span>
            <strong>2</strong>

function signup(event){
  event.preventDefault();

  const name = document.getElementById("signupName")
    .value.trim();

  const business = document.getElementById("signupBusiness")
    .value.trim();

  const phone = document.getElementById("signupPhone")
    .value.trim();

  const email = document.getElementById("signupEmail")
    .value.trim()
    .toLowerCase();

  const password = document.getElementById("signupPassword")
    .value;

  const confirm = document.getElementById("signupConfirm")
    .value;

  const errorBox = document.getElementById("signupError");

  if(password.length < 6){
    errorBox.innerHTML = `
      <div class="auth-error">
        Password must be at least 6 characters.
      </div>
    `;
    return;
  }

  if(password !== confirm){
    errorBox.innerHTML = `
      <div class="auth-error">
        Passwords do not match.
      </div>
    `;
    return;
  }

  const users = getUsers();

  if(users.some(u => u.email.toLowerCase() === email)){
    errorBox.innerHTML = `
      <div class="auth-error">
        An account with this email already exists.
        Please log in instead.
      </div>
    `;
    return;
  }

  const user = {
    id:uid("user"),
    name,
    business,
    phone,
    email,
    password,
    createdAt:new Date().toISOString()
  };

  users.push(user);
  saveUsers(users);

  setSession(user.id);

  currentPage = "home";

  renderDashboard();

  showToast("Account created successfully!");
}

function saveDebt(event){
  event.preventDefault();

  const user = getCurrentUser();

  if(!user) return;

  const customerName = document.getElementById("debtCustomerName")
    .value.trim();

  const customerPhone = document.getElementById("debtCustomerPhone")
    .value.trim();

  const amount = Number(
    document.getElementById("debtAmount").value
  );

  const item = document.getElementById("debtItem")
    .value.trim();

  const dateAdded = document.getElementById("debtDate").value;

  const dueDate = document.getElementById("debtDueDate").value;

  let debts = getDebts();

  if(editingDebtId){

    const index = debts.findIndex(
      d=>d.id === editingDebtId &&
         d.userId === user.id
    );

    if(index === -1){
      showToast("Debt could not be found.");
      return;
    }

    let paidAmount = Number(
      document.getElementById("debtPaidAmount")?.value || 0
    );

    paidAmount = Math.max(0,Math.min(amount,paidAmount));

    debts[index] = {
      ...debts[index],
      customerName,
      customerPhone,
      amount,
      paidAmount,
      item,
      dateAdded,
      dueDate,
      paid:paidAmount >= amount,
      paidDate:paidAmount >= amount
        ? (debts[index].paidDate || todayString())
        : null
    };

    saveDebts(debts);

    editingDebtId = null;

    navigate("customers");

    showToast("Debt updated successfully.");

  }else{

    const debt = {
      id:uid("debt"),
      userId:user.id,
      customerName,
      customerPhone,
      amount,
      paidAmount:0,
      item,
      dateAdded,
      dueDate,
      paid:false,
      paidDate:null,
      createdAt:new Date().toISOString()
    };

    debts.push(debt);

    saveDebts(debts);

    navigate("customers");

    showToast("Debt added successfully.");
  }
}

function filterButton(value,label){
  return `

      class="filter-btn ${currentFilter===value ? "active":""}"

}

function updateSearch(value){
  searchText = value;

  if(input){

        input.value.length,
        input.value.length
      );
    }catch(e){}
  }
}

/* =========================
   WHATSAPP
========================= */

function cleanNigeriaPhone(phone){
  let p = String(phone || "")
    .replace(/\D/g,"");

  if(p.startsWith("234")){
    return p;
  }

  if(p.startsWith("0")){
    return "234" + p.substring(1);
  }

  return p;
}

function whatsappReminder(id){
  const debt = userDebts().find(d=>d.id === id);

  if(!debt) return;

  const phone = cleanNigeriaPhone(debt.customerPhone);

  if(!phone){
    showToast("Customer phone number is missing.");
    return;
  }

  const remaining = getDebtRemaining(debt);

  const message =
`Hello ${debt.customerName}, this is a friendly reminder from ${getCurrentUser().business}. You currently have an outstanding balance of ${money(remaining)} for ${debt.item || "your purchase"}. The agreed due date was ${formatDate(debt.dueDate)}. Kindly make payment when you can. Thank you.`;

  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message);

  window.open(url,"_blank");
}

function openPaymentModal(id){

          ${escapeHTML(debt.customerName)}
          currently owes
          <strong>${money(remaining)}</strong>.
        </p>

        <div class="form-group">
          <label>Payment Amount (₦)</label>

          <input
            id="paymentAmount"
            type="number"
            min="0"
            max="${remaining}"
            step="0.01"
            placeholder="${remaining}">
        </div>

        <div class="modal-actions">

          <button

          </button>

          </button>

        </div>

      </div>

    </div>
  `);
}

function recordPayment(id){
  const amount = Number(
    document.getElementById("paymentAmount").value
  );

  if(!amount || amount <= 0){
    showToast("Enter a valid payment amount.");
    return;
  }

  let debts = getDebts();

  const index = debts.findIndex(
    d=>d.id===id &&
       d.userId===getCurrentUser().id
  );

  if(index === -1) return;

  const debt = debts[index];

  const remaining = getDebtRemaining(debt);

  if(amount > remaining){
    showToast("Payment cannot be greater than the remaining balance.");
    return;
  }

  debt.paidAmount =
    Number(debt.paidAmount || 0) + amount;

  if(getDebtRemaining(debt) <= 0){
    debt.paid = true;
    debt.paidDate = todayString();
  }else{
    debt.paid = false;
    debt.paidDate = null;
  }

  saveDebts(debts);

  closeModal("paymentModal");

  renderCurrentPage();

  showToast(
    debt.paid
    ? "Debt fully paid! 🎉"
    : "Payment recorded successfully."
  );
}

function markPaid(id){
  let debts = getDebts();

  const index = debts.findIndex(
    d=>d.id===id &&
       d.userId===getCurrentUser().id
  );

  if(index === -1) return;

  debts[index].paidAmount = Number(debts[index].amount);
  debts[index].paid = true;
  debts[index].paidDate = todayString();

  saveDebts(debts);

  renderCurrentPage();

  showToast("Debt marked as paid.");
}

function saveProfile(){
  const current = getCurrentUser();

  const name = document.getElementById("editProfileName")
    .value.trim();

  const business = document.getElementById("editProfileBusiness")
    .value.trim();

  const phone = document.getElementById("editProfilePhone")
    .value.trim();

  if(!name || !business || !phone){
    showToast("Please fill all fields.");
    return;
  }

  const users = getUsers();

  const index = users.findIndex(
    u=>u.id===current.id
  );

  if(index===-1) return;

  users[index].name = name;
  users[index].business = business;
  users[index].phone = phone;

  saveUsers(users);

  closeModal("profileModal");

  renderDashboard();

  showToast("Profile updated.");
}

            type="password">
        </div>

          <input
            id="newPassword"
            type="password">
        </div>

        <div class="form-group">
          <label>Confirm New Password</label>

          <input
            id="confirmNewPassword"
            type="password">
        </div>

        <div class="modal-actions">

          <button
            class="btn btn-secondary"
            onclick="closeModal('passwordModal')">
            Cancel
          </button>

            class="btn btn-primary"
            onclick="changePassword()">
            Update Password
          </button>

        </div>

      </div>

  `);
}

function changePassword(){
  const current = getCurrentUser();

  const oldPassword =
    document.getElementById("oldPassword").value;

  const newPassword =
    document.getElementById("newPassword").value;

  const confirm =
    document.getElementById("confirmNewPassword").value;

  if(oldPassword !== current.password){
    showToast("Current password is incorrect.");
    return;
  }

  if(newPassword.length < 6){
    showToast("New password must be at least 6 characters.");
    return;
  }

  if(newPassword !== confirm){
    showToast("New passwords do not match.");
    return;
  }

  const users = getUsers();

  const index = users.findIndex(
    u=>u.id===current.id
  );

  users[index].password = newPassword;

  saveUsers(users);

  closeModal("passwordModal");

  showToast("Password changed successfully.");
}
